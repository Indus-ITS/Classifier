[project]
name = "classifier"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "psycopg2-binary>=2.9",
]

[project.scripts]
classify            = "classifier.cli.classify:main"
classify-rds        = "classifier.cli.classify_rds:main"
convert-classified  = "classifier.tools.convert_classified:main"
build-type-enum     = "classifier.tools.build_type_enum:main"
learn-sheet-patterns      = "classifier.tools.learn_sheet_patterns:main"
sort-files          = "classifier.cli.sort:main"
sort-by-source      = "classifier.cli.sort_source:main"
update-snapshot     = "classifier.cli.update_snapshot:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
